[package]
name = "cozgut-pos"
version = "0.1.0"
description = "Çözgüt POS desktop client (Tauri wrapper around the Vite/React client)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1", features = ["shell-open"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "cozgut-pos"
path = "src/main.rs"
